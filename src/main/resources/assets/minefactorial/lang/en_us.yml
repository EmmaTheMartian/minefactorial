item.minefactorial:
  straw: Straw
  straw.desc:
    "0": Use to drink fluid from the world or from tanks
    "1": Side effects may vary
  mega_straw: Mega Straw
  mega_straw.desc:
    "0": Woah. You must be very thirsty to want this much slurping power
    "1": Use to drink fluid from the world or from tanks
    "2": Side effects may vary
  wrench: Wrench
  wrench.desc.0: Rotates blocks
  screwdriver: Screwdriver
  screwdriver.desc.0: Use on machinery to toggle auto-eject
  ruler: Ruler
  ruler.desc.0: Click two blocks to measure the distance between them
  tree_tap: Tree Tap
  tree_tap.desc.0: Use on Rubber Wood to obtain Raw Rubber
  tweakeruler: Tweakeruler
  tweakeruler.desc:
    "0": A ruler capable of tweaking and modifying the world around you
    "1": With great power comes great responsibility.
  tweakeruler.desc.long:
    "0": Switch modes by crouching and using the item without looking at a block
    "1": In §b[REPLACE]§r mode, selected blocks are replaced with the block in your offhand
    "2": In §b[REMOVE]§r mode, selected blocks are removed
    "3": In §b[NONE]§r mode, it acts as a generic ruler
  safari_net: Safari Net
  safari_net.captured: Safari Net (%s)
  safari_net.desc.0: Throw at a mob to capture it, then use again to release it elsewhere.

  raw_rubber: Raw Rubber
  raw_rubber.desc.0: Obtain by using a Tree Tap on Rubber Wood
  rubber_ingot: Rubber Bar
  raw_plastic: Raw Plastic
  plastic_ingot: Plastic Ingot
  plastic_sheets: Plastic Sheets
  raw_meat_ingot: Raw Meat "Ingot"
  raw_meat_ingot.desc.0: A repulsive culmination of meat from a variety of sources.
  cooked_meat_ingot: Cooked Meat "Ingot"
  cooked_meat_ingot.desc.0: Meatloaf, except now you know how it was made.

