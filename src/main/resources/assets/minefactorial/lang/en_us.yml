block.minefactorial:
  # Logistics
  conveyor: Conveyor
  conveyor.desc:
    "0": Transports items and entities
    "1": Right-click with a wrench to make vertical conveyors
  hopping_conveyor: Hopping Conveyor
  hopping_conveyor.desc:
    "0": Transports items and entities and moves items into a container below
    "1": Right-click with a wrench to make vertical conveyors
    "2": Right-click with a screwdriver to modify maximum item count per transfer
  ejector: Ejector
  ejector.desc:
    "0": Ejects items out of its internal inventory when given a redstone signal
    "1": Right-click with a screwdriver to modify the minimum amount of items it can eject at once
  fluid_extractor: Fluid Extractor
  energy_pipe: Energy Cable
